<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Palette Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

        <div class="column3" id="col3">

        </div>
        <div class="column4" id="col4">
            <div id="code" class="codes">
                <p id="code4">#color</p>
                <button class="copy" id="4">Copy</button>
            </div>
        </div>
        <div class="column5" id="col5">
            <div id="code" class="codes">
                <p id="code5">#color</p>
                <button class="copy" id="5">Copy</button>
            </div>
        </div>
    </div>
    <div>
        <button class="generate"> Generate </button>
    </div>
    <script src="main.js"></script>
</body>
</html>
